<text x="40" y="520" font-size="14" font-weight="700">同一角度的其他读数（北京 08:00，2024-01-15）</text>
<text x="40" y="546" font-size="13">UTC 00:00，当天</text>
<text x="40" y="570" font-size="13">Asia/Kolkata 05:30，当天（+5:30）</text>
<text x="40" y="594" font-size="13">Asia/Kathmandu 05:45，当天（+5:45）</text>
<text x="40" y="618" font-size="13">America/St_Johns 前一日 20:30（−3:30）</text>
<text x="40" y="642" font-size="13">2024-03-10 北京 17:00 → 洛杉矶 01:00（−8）；北京 18:00 → 洛杉矶 03:00（−7）。02 点这一小时没有出现。</text>
<text x="40" y="666" font-size="13">2024-11-03 北京 16:00 与 17:00 都读到洛杉矶 01:00，偏移分别是 −7 和 −8。</text>
<text x="40" y="710" font-size="12" fill="#333">正上方是北京 00，顺时针。方块和「早8」标出北京 08:00。指针停在这个示例的 08:00，不是实时时钟。</text>
<text x="40" y="732" font-size="12" fill="#333">环是一个北京公历日，不是以现在为中心滚动的 24 小时。小组件实机会跟随浅色/深色的 primary 颜色；这张图只画出形状和对应关系。</text>
